<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How to stop losing errors, commands, and paths in your clipboard</title>
  <desc id="desc">Editorial illustration showing shell-heavy clipboard recovery for commands, errors, and file paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111d"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <g stroke="rgba(0,212,255,0.08)" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M0 630H1200"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/>
  </g>
  <g transform="translate(62 60)">
    <rect x="0" y="0" width="1076" height="600" rx="28" fill="rgba(15,23,42,0.84)" stroke="rgba(0,212,255,0.18)"/>
    <text x="44" y="58" fill="#00d4ff" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">ClipGate Workflow Guide</text>
    <text x="44" y="114" fill="#e6edf3" font-size="42" font-family="Inter, Arial, sans-serif" font-weight="800">How to stop losing errors,</text>
    <text x="44" y="162" fill="#e6edf3" font-size="42" font-family="Inter, Arial, sans-serif" font-weight="800">commands, and paths in</text>
    <text x="44" y="210" fill="#e6edf3" font-size="42" font-family="Inter, Arial, sans-serif" font-weight="800">your clipboard</text>
    <text x="44" y="250" fill="#94a3b8" font-size="22" font-family="Inter, Arial, sans-serif">A workflow-first playbook for shell-heavy sessions, faster recovery,</text>
    <text x="44" y="280" fill="#94a3b8" font-size="22" font-family="Inter, Arial, sans-serif">and escaping the hidden time tax of a one-slot clipboard.</text>

    <g transform="translate(44 324)">
      <rect x="0" y="0" width="618" height="228" rx="20" fill="rgba(7,13,22,0.92)" stroke="rgba(0,212,255,0.14)"/>
      <text x="22" y="34" fill="#64748b" font-size="17" font-family="JetBrains Mono, monospace"># recovery loop in a shell-heavy session</text>
      <text x="22" y="70" fill="#00d4ff" font-size="19" font-family="JetBrains Mono, monospace">$</text>
      <text x="44" y="70" fill="#e6edf3" font-size="19" font-family="JetBrains Mono, monospace">echo "TypeError: Cannot read 'map'" | </text>
      <text x="430" y="70" fill="#00d4ff" font-size="19" font-family="JetBrains Mono, monospace" font-weight="700">cg copy</text>
      <text x="22" y="106" fill="#00d4ff" font-size="19" font-family="JetBrains Mono, monospace">$</text>
      <text x="44" y="106" fill="#e6edf3" font-size="19" font-family="JetBrains Mono, monospace">kubectl logs api-784ccf7d9d-l8b8f | </text>
      <text x="430" y="106" fill="#00d4ff" font-size="19" font-family="JetBrains Mono, monospace" font-weight="700">cg copy</text>
      <text x="22" y="142" fill="#00d4ff" font-size="19" font-family="JetBrains Mono, monospace">$</text>
      <text x="44" y="142" fill="#e6edf3" font-size="19" font-family="JetBrains Mono, monospace">pwd | </text>
      <text x="110" y="142" fill="#00d4ff" font-size="19" font-family="JetBrains Mono, monospace" font-weight="700">cg copy</text>
      <line x1="22" y1="168" x2="584" y2="168" stroke="#263548"/>
      <text x="22" y="200" fill="#94a3b8" font-size="17" font-family="JetBrains Mono, monospace">error</text>
      <text x="112" y="200" fill="#e6edf3" font-size="17" font-family="JetBrains Mono, monospace">preserved for the ticket instead of lost</text>
      <text x="22" y="226" fill="#94a3b8" font-size="17" font-family="JetBrains Mono, monospace">command</text>
      <text x="112" y="226" fill="#e6edf3" font-size="17" font-family="JetBrains Mono, monospace">ready to re-run after the context switch</text>
      <text x="22" y="252" fill="#94a3b8" font-size="17" font-family="JetBrains Mono, monospace">path</text>
      <text x="112" y="252" fill="#e6edf3" font-size="17" font-family="JetBrains Mono, monospace">one command away instead of another hunt</text>
    </g>

    <g transform="translate(694 324)">
      <rect x="0" y="0" width="328" height="104" rx="18" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.18)"/>
      <text x="24" y="38" fill="#00d4ff" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">What improves</text>
      <text x="24" y="68" fill="#e6edf3" font-size="16" font-family="Inter, Arial, sans-serif">Faster recovery after context switches</text>
      <text x="24" y="92" fill="#e6edf3" font-size="16" font-family="Inter, Arial, sans-serif">Fewer scrollback hunts and re-runs</text>

      <rect x="0" y="126" width="328" height="178" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="24" y="162" fill="#e6edf3" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="800">The hidden clipboard tax</text>
      <text x="24" y="196" fill="#94a3b8" font-size="15" font-family="Inter, Arial, sans-serif">Wrong clipboard habit:</text>
      <text x="24" y="220" fill="#e6edf3" font-size="15" font-family="Inter, Arial, sans-serif">copy -> overwrite -> re-run -> lose flow</text>
      <text x="24" y="254" fill="#94a3b8" font-size="15" font-family="Inter, Arial, sans-serif">Better loop:</text>
      <text x="24" y="278" fill="#e6edf3" font-size="15" font-family="Inter, Arial, sans-serif">copy -> classify -> retrieve by type</text>
    </g>
  </g>
</svg>
