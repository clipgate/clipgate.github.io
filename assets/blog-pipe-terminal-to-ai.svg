<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pipe terminal output to Claude Code, Cursor, and Aider</title>
  <desc id="desc">Editorial illustration showing a terminal piping a redacted error payload into an AI assistant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <g stroke="rgba(0,212,255,0.08)" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>

  <g transform="translate(60 70)">
    <text x="0" y="24" fill="#00d4ff" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">CLIPGATE -> AI HAND-OFF</text>
    <text x="0" y="68" fill="#e6edf3" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="800">Pipe terminal output to Claude Code,</text>
    <text x="0" y="106" fill="#e6edf3" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="800">Cursor, and Aider — safely.</text>
  </g>

  <g transform="translate(60 220)">
    <rect x="0" y="0" width="420" height="280" rx="20" fill="rgba(7,13,22,0.92)" stroke="rgba(0,212,255,0.18)"/>
    <circle cx="22" cy="22" r="6" fill="#f87171"/>
    <circle cx="42" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="22" r="6" fill="#34d399"/>
    <text x="22" y="70" fill="#64748b" font-size="14" font-family="JetBrains Mono, monospace"># build failed in CI</text>
    <text x="22" y="100" fill="#00d4ff" font-size="15" font-family="JetBrains Mono, monospace">$</text>
    <text x="42" y="100" fill="#e6edf3" font-size="15" font-family="JetBrains Mono, monospace">npm run build 2&gt;&amp;1 |</text>
    <text x="282" y="100" fill="#34d399" font-size="15" font-family="JetBrains Mono, monospace" font-weight="700">cg copy</text>
    <text x="22" y="138" fill="#f87171" font-size="14" font-family="JetBrains Mono, monospace">TypeError: Cannot read 'map'</text>
    <text x="22" y="158" fill="#f87171" font-size="14" font-family="JetBrains Mono, monospace">  of undefined</text>
    <text x="22" y="178" fill="#94a3b8" font-size="13" font-family="JetBrains Mono, monospace">  at handleRequest (api.js:42)</text>
    <line x1="22" y1="200" x2="398" y2="200" stroke="#263548"/>
    <text x="22" y="226" fill="#94a3b8" font-size="13" font-family="JetBrains Mono, monospace">tagged:</text>
    <text x="86" y="226" fill="#34d399" font-size="13" font-family="JetBrains Mono, monospace" font-weight="700">error</text>
    <text x="22" y="248" fill="#94a3b8" font-size="13" font-family="JetBrains Mono, monospace">secrets:</text>
    <text x="92" y="248" fill="#34d399" font-size="13" font-family="JetBrains Mono, monospace" font-weight="700">[REDACTED]</text>
  </g>

  <g transform="translate(490 340)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="url(#pipe)" opacity="0.92"/>
    <text x="110" y="23" fill="#0a0e17" font-size="14" font-family="JetBrains Mono, monospace" font-weight="700" text-anchor="middle">cg paste -t error</text>
    <polygon points="220,0 256,18 220,36" fill="#34d399"/>
  </g>

  <g transform="translate(486 222)">
    <rect x="0" y="0" width="44" height="22" rx="6" fill="rgba(248,113,113,0.18)" stroke="rgba(248,113,113,0.5)"/>
    <text x="22" y="16" fill="#f87171" font-size="12" font-family="JetBrains Mono, monospace" font-weight="700" text-anchor="middle">error</text>
    <path d="M22 22 L22 110" stroke="#f87171" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="22" cy="118" r="4" fill="#f87171"/>
  </g>

  <g transform="translate(760 220)">
    <rect x="0" y="0" width="380" height="280" rx="20" fill="rgba(7,13,22,0.92)" stroke="rgba(52,211,153,0.22)"/>
    <text x="22" y="44" fill="#34d399" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">AI assistants</text>
    <rect x="22" y="62" width="336" height="56" rx="12" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.22)"/>
    <text x="38" y="86" fill="#e6edf3" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="700">Claude Code</text>
    <text x="38" y="106" fill="#94a3b8" font-size="13" font-family="JetBrains Mono, monospace">MCP-native: reads cg directly</text>
    <rect x="22" y="130" width="336" height="56" rx="12" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.22)"/>
    <text x="38" y="154" fill="#e6edf3" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="700">Cursor</text>
    <text x="38" y="174" fill="#94a3b8" font-size="13" font-family="JetBrains Mono, monospace">cg paste -t error | pbcopy</text>
    <rect x="22" y="198" width="336" height="56" rx="12" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.22)"/>
    <text x="38" y="222" fill="#e6edf3" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="700">Aider</text>
    <text x="38" y="242" fill="#94a3b8" font-size="13" font-family="JetBrains Mono, monospace">cg paste -t error | aider</text>
  </g>

  <g transform="translate(60 540)">
    <rect x="0" y="0" width="1080" height="48" rx="14" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.24)"/>
    <text x="22" y="30" fill="#34d399" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700">SECRETS REDACTED AT PIPE TIME</text>
    <text x="320" y="30" fill="#94a3b8" font-size="14" font-family="Inter, Arial, sans-serif">.env exports, OAuth dumps, AWS creds — replaced before the AI ever sees them.</text>
  </g>
</svg>
