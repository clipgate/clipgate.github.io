<stop offset="0%" stop-color="rgba(0,212,255,.18)"/><stop offset="100%" stop-color="rgba(96,165,250,.10)"/>
</linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
