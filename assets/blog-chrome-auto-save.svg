<text x="14" y="24" font-size="12" fill="#64748b">// snippet 2 - error</text>
<text x="14" y="46" font-size="13" fill="#f87171">Webhook Error: No signatures found matching the expected</text>
</g>
<g transform="translate(28 308)" font-family="JetBrains Mono,monospace">
<rect width="584" height="60" rx="10" fill="rgba(15,23,42,.85)" stroke="rgba(245,158,11,.22)"/>
