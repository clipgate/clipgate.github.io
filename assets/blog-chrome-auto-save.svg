<text x="28" y="92" font-size="28" font-weight="800" fill="#e6edf3">One block.</text>
<text x="28" y="124" font-size="28" font-weight="800" fill="#e6edf3">Every snippet.</text>
<text x="28" y="156" font-size="16" fill="#9caab8">Auto-classified, redacted,</text>
<text x="28" y="178" font-size="16" fill="#9caab8">ready for the model.</text>
