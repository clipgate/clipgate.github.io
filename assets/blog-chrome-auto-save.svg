<text x="14" y="46" font-size="13" fill="#f59e0b">{"type": "payment_intent.succeeded", "data": ...}</text>
</g>
<g transform="translate(28 384)" font-family="JetBrains Mono,monospace">
<rect width="584" height="60" rx="10" fill="rgba(15,23,42,.85)" stroke="rgba(52,211,153,.22)"/>
<text x="14" y="24" font-size="12" fill="#64748b">// snippet 4 - command</text>
<text x="14" y="46" font-size="13" fill="#34d399">stripe listen --forward-to localhost:3000/webhook</text>
</g>
<text x="28" y="474" font-size="12" fill="#6e7681">8 tabs open  /  6 snippets copied  /  1 hour of research</text>
</g>
