<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Auto-save Chrome snippets for Claude and ChatGPT</title>
<desc id="d">Browser frame with multiple tabs and snippets flowing into a single bundled vault for AI assistants.</desc>
<defs>
