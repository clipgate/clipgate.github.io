<stop offset="50%" stop-color="#00d4ff" stop-opacity=".85"/>
<stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1200" height="630" rx="28" fill="url(#bg)"/>
