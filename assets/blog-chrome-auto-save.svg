<rect width="584" height="92" rx="10" fill="rgba(15,23,42,.85)" stroke="rgba(0,212,255,.20)"/>
<text x="14" y="26" font-size="12" fill="#64748b">// snippet 1 - code</text>
<text x="14" y="50" font-size="13" fill="#e6edf3">const sig = req.headers['stripe-signature'];</text>
<text x="14" y="72" font-size="13" fill="#e6edf3">const event = stripe.webhooks.constructEvent(...)</text>
</g>
<g transform="translate(28 232)" font-family="JetBrains Mono,monospace">
