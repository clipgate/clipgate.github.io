</g>
<g transform="translate(28 264)" font-size="13" fill="#e6edf3">
<circle cx="6" cy="0" r="4" fill="#60a5fa"/><text x="22" y="4">4 URLs from stripe.com docs</text>
<circle cx="6" cy="26" r="4" fill="#34d399"/><text x="22" y="30">2 code blocks (Node, JS)</text>
<circle cx="6" cy="52" r="4" fill="#f59e0b"/><text x="22" y="56">1 JSON event payload</text>
<circle cx="6" cy="78" r="4" fill="#f87171"/><text x="22" y="82">1 webhook error message</text>
<circle cx="6" cy="104" r="4" fill="#a855f7"/><text x="22" y="108">1 stripe CLI command</text>
</g>
<rect x="28" y="378" width="344" height="1" fill="rgba(0,212,255,.18)"/>
<text x="28" y="396" font-size="12" fill="#6e7681">pipe to claude / paste into chatgpt / cursor</text>
